<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2f4a5c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2246%22 fill=%22%23f6ecd4%22/%3E%3Cellipse cx=%2250%22 cy=%2254%22 rx=%2230%22 ry=%2222%22 fill=%22%231c2140%22/%3E%3Ccircle cx=%2250%22 cy=%2254%22 r=%228%22 fill=%22%23ffd46b%22/%3E%3C/svg%3E">
<title>Hollowdeep — Playable Prototype</title>
<style>
:root{
  --paper:#f6ecd4; --paper2:#efe0bd; --ink:#3a2e22; --ink2:#6b5a45; --dim:#8f7d63;
  --lumen:#ffd46b; --moss:#7fb07a; --deep:#24324a; --rust:#b0573a; --teal:#4f8c8a;
  --good:#4d8a4f; --bad:#b0473a; --accent:#c9822f; --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
  background:
    radial-gradient(ellipse at 20% 0%,rgba(255,236,190,.9),transparent 55%),
    radial-gradient(ellipse at 90% 30%,rgba(140,190,170,.35),transparent 50%),
    linear-gradient(180deg,#f1e2bf 0%,#cdbf96 18%,#86ab9c 42%,#3f6170 70%,#1b2436 100%) fixed;
  overscroll-behavior:none;
}
h1,h2,h3{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;margin:0;font-weight:600}
#app{max-width:540px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header#top{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 8px) 12px 6px;
  background:linear-gradient(180deg,rgba(246,236,212,.97),rgba(239,224,189,.93));
  border-bottom:1px solid rgba(110,80,40,.25);box-shadow:0 4px 18px rgba(40,30,10,.15)}
.titlebar{display:flex;align-items:center;gap:8px}
.titlebar h1{font-size:21px;letter-spacing:.5px;flex:1}
.titlebar h1 small{font:12px system-ui;color:var(--dim);margin-left:6px}
.pill{font-size:11px;padding:3px 8px;border-radius:99px;background:#e2cf9f;color:var(--ink);border:1px solid rgba(110,80,40,.3);white-space:nowrap}
.pill.test{background:#ffe08a;font-weight:700}
.iconbtn{border:0;background:rgba(255,255,255,.55);border-radius:12px;font-size:19px;width:38px;height:38px;cursor:pointer}
#resbar{display:flex;gap:6px;overflow-x:auto;padding:6px 0 2px;scrollbar-width:none}
#resbar::-webkit-scrollbar{display:none}
.res{flex:0 0 auto;display:flex;align-items:center;gap:3px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.6);font-size:13px;font-variant-numeric:tabular-nums;border:1px solid rgba(110,80,40,.15)}
.res.full{background:#f4c9b8}
main#view{flex:1;padding:10px 10px 96px}
nav#tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:center;
  background:linear-gradient(180deg,rgba(30,40,58,.92),rgba(20,26,40,.98));padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);border-top:1px solid rgba(255,212,107,.25)}
nav#tabs .wrap{display:flex;max-width:540px;width:100%}
nav#tabs button{flex:1;border:0;background:none;color:#cfc3a6;font-size:11px;padding:4px 0;cursor:pointer;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
nav#tabs button span{font-size:21px;line-height:1.1}
nav#tabs button.on{color:var(--lumen);background:rgba(255,212,107,.1)}
nav#tabs button .dot{position:absolute;top:2px;right:24%;width:8px;height:8px;border-radius:50%;background:#ff8a5c;box-shadow:0 0 6px #ff8a5c}
.card{background:radial-gradient(circle at 15% 8%,rgba(255,252,240,.97),rgba(246,236,212,.95) 60%,rgba(236,222,190,.95));
  border-radius:var(--radius);padding:12px;margin:0 0 10px;border:1px solid rgba(110,80,40,.22);box-shadow:0 6px 18px rgba(30,20,5,.18)}
.card h2{font-size:18px;margin-bottom:4px}
.card h3{font-size:16px}
.row{display:flex;align-items:center;gap:8px}
.row.between{justify-content:space-between}
.wrapgap{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dim{color:var(--dim);font-size:12.5px}
.small{font-size:12.5px}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;background:#e9dab4;border:1px solid rgba(110,80,40,.2);margin-right:3px;white-space:nowrap}
.tag.good{background:#d3e8c9}.tag.bad{background:#f2cfc4}.tag.lumen{background:#fff0bf}
.cost{display:inline-flex;gap:2px;align-items:center;font-size:12.5px;padding:1px 6px;border-radius:8px;background:rgba(255,255,255,.6);margin:1px 2px 1px 0;font-variant-numeric:tabular-nums}
.cost.short{background:#f6c8bb;color:#7a2a1a}
.btn{border:0;border-radius:12px;padding:10px 14px;font:600 14px system-ui;cursor:pointer;color:#fff8e6;
  background:linear-gradient(180deg,#d39444,#a8682a);box-shadow:0 3px 0 #7a4a1c,0 4px 10px rgba(0,0,0,.18);min-height:42px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #7a4a1c}
.btn.alt{background:linear-gradient(180deg,#5f9c98,#3f706f);box-shadow:0 3px 0 #2a4b4a}
.btn.deep{background:linear-gradient(180deg,#43577a,#28354f);box-shadow:0 3px 0 #18223a}
.btn.red{background:linear-gradient(180deg,#c8634c,#94402e);box-shadow:0 3px 0 #6a2a1c}
.btn.ghost{background:rgba(255,255,255,.6);color:var(--ink);box-shadow:0 2px 0 rgba(110,80,40,.3)}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}
.btn:disabled{filter:grayscale(.8);opacity:.55;cursor:not-allowed;transform:none}
.bar{height:9px;border-radius:9px;background:rgba(80,60,30,.15);overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#e8b45a,#ffd46b);box-shadow:0 0 8px rgba(255,212,107,.8);transition:width .25s linear}
.bar.xp>i{background:linear-gradient(90deg,#6aa36a,#a8d68a)}
.bar.rich>i{background:linear-gradient(90deg,#8a6b3a,#d9b46a)}
.bar.boost>i{background:linear-gradient(90deg,#c9822f,#ffcf5a,#fff1b8)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:rgba(255,255,255,.55);border-radius:12px;padding:8px;text-align:center}
.stat b{display:block;font:600 19px Georgia,serif}
.stat span{font-size:11.5px;color:var(--dim)}
.scene{border-radius:var(--radius);overflow:hidden;margin-bottom:10px;box-shadow:0 6px 18px rgba(30,20,5,.25);border:1px solid rgba(110,80,40,.3);line-height:0}
.scene svg{width:100%;height:auto;display:block}
.bld{display:grid;grid-template-columns:44px 1fr;gap:10px}
.bld .ic{font-size:30px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:rgba(255,255,255,.55)}
.lvl{font:600 12px system-ui;color:#fff;background:#8a6a3a;border-radius:8px;padding:1px 6px;margin-left:4px}
.layer{border-left:6px solid var(--c,#999)}
.locked{opacity:.6}
.log{max-height:300px;overflow:auto}
.log div{padding:5px 0;border-bottom:1px dashed rgba(110,80,40,.2);font-size:13px}
.log .t{color:var(--dim);font-size:11px;margin-right:4px}
.segs{display:flex;gap:4px}
.segs button{flex:1}
/* training */
#tapzone{position:relative;user-select:none;-webkit-user-select:none;touch-action:manipulation;cursor:pointer;border-radius:var(--radius);overflow:hidden;
  background:radial-gradient(ellipse at 50% 120%,#a9c48a 0%,#7ea36f 35%,transparent 36%),linear-gradient(180deg,#f7e6bd,#e6cf98 60%,#cdb47c);border:1px solid rgba(110,80,40,.3);box-shadow:inset 0 0 30px rgba(120,80,20,.25)}
#tapzone svg{width:100%;display:block}
#tapzone .hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:13px;color:#5a4528;pointer-events:none}
.float{position:absolute;pointer-events:none;font:700 18px Georgia,serif;color:#a25c12;text-shadow:0 1px 0 #fff6d8;animation:floatup .9s ease-out forwards}
.float.mark{color:#6a4fa0}
@keyframes floatup{from{opacity:1;transform:translate(-50%,0) scale(1)}to{opacity:0;transform:translate(-50%,-60px) scale(1.25)}}
#swordArm{transform-box:fill-box;transform-origin:10% 90%;transform:rotate(-55deg)}
#swordArm.swing{animation:swing .22s ease-out}
@keyframes swing{0%{transform:rotate(-70deg)}45%{transform:rotate(45deg)}100%{transform:rotate(-55deg)}}
#dummyG{transform-box:fill-box;transform-origin:50% 100%}
#dummyG.hit{animation:wobble .3s ease-out}
@keyframes wobble{0%{transform:rotate(0)}30%{transform:rotate(9deg)}60%{transform:rotate(-5deg)}100%{transform:rotate(0)}}
.spark{animation:spark .3s ease-out forwards}
@keyframes spark{from{opacity:1}to{opacity:0}}
/* modal */
#modal{position:fixed;inset:0;z-index:50;background:rgba(15,18,30,.6);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
#modal.hidden{display:none}
#modal .sheet{width:100%;max-width:540px;max-height:88vh;overflow:auto;background:radial-gradient(circle at 20% 0%,#fffaf0,#f3e5c4);border-radius:20px 20px 0 0;padding:16px 14px calc(env(safe-area-inset-bottom) + 16px);box-shadow:0 -10px 30px rgba(0,0,0,.35);animation:rise .25s ease-out}
@media(min-width:600px){#modal{align-items:center}#modal .sheet{border-radius:20px}}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#toasts{position:fixed;top:96px;left:0;right:0;z-index:60;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:rgba(36,50,74,.95);color:#fff3d0;padding:8px 14px;border-radius:12px;font-size:13.5px;max-width:92%;box-shadow:0 6px 18px rgba(0,0,0,.3);animation:rise .2s ease-out}
/* golem reveal */
.raidscene{border-radius:14px;overflow:hidden;line-height:0;margin:8px 0}
.raidscene svg{width:100%;display:block}
.golem{transform-box:fill-box;transform-origin:50% 100%;transform:rotate(90deg) translateX(0)}
.golem .eye{opacity:0}
.golem .arm{opacity:0}
.wake .golem{animation:standup .8s cubic-bezier(.3,1.5,.5,1) forwards;animation-delay:calc(var(--i) * .18s)}
.wake .golem .eye{animation:glow .4s forwards;animation-delay:calc(var(--i) * .18s + .6s)}
.wake .golem .arm{animation:glow .3s forwards;animation-delay:calc(var(--i) * .18s + .5s)}
@keyframes standup{0%{transform:rotate(90deg)}60%{transform:rotate(-8deg) translateY(-6px)}100%{transform:rotate(0) translateY(-2px)}}
@keyframes glow{to{opacity:1}}
.raider{transition:transform 1.6s ease-in-out}
.approach .raider{transform:translateX(70px)}
.flee .raider{transform:translateX(-90px);transition-duration:1s}
.shake{animation:shake .4s 2}
@keyframes shake{25%{transform:translate(2px,1px)}50%{transform:translate(-2px,-1px)}75%{transform:translate(1px,-2px)}}
.reveal-line{opacity:0;transition:opacity .5s;line-height:1.4}
.reveal-line.on{opacity:1}
.stars{font-size:26px;letter-spacing:4px}
.lumenglow{filter:drop-shadow(0 0 4px #ffd46b)}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.switch{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px dashed rgba(110,80,40,.25)}
/* Rim City */
#cityLoader{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,#2c3a5a 0,#141a2e 70%)}
#cityLoader.hidden{display:none}
#cityLoader .ldCard{width:min(300px,80%);text-align:center;color:#fff3d0}
#cityLoader .ldTitle{font:600 20px Georgia,serif}
#cityLoader .ldSub{font-size:12px;opacity:.75;margin:4px 0 12px}
#cityLoader .ldBar{height:10px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
#cityLoader .ldBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#c9822f,#ffd46b);transition:width .2s}
#cityLoader .ldPct{font-size:12px;margin-top:6px;opacity:.8}
#city{position:fixed;left:0;right:0;top:96px;bottom:64px;z-index:5;overflow:hidden;background:#3e5854}
#city.hidden{display:none}
#cityCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
#cityCanvas:active{cursor:grabbing}
.cityTop{position:absolute;left:8px;right:56px;top:8px;pointer-events:none;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.cityTitle{font:600 15px Georgia,serif;background:rgba(246,236,212,.92);padding:4px 10px;border-radius:12px;box-shadow:0 3px 10px rgba(0,0,0,.2)}
#cityInfo{font-size:11.5px;background:rgba(36,50,74,.82);color:#fff3d0;padding:3px 9px;border-radius:10px;max-width:100%}
#ticker{max-width:100%;overflow:hidden;background:rgba(255,250,235,.9);border-radius:10px;padding:3px 9px;font-size:12px;box-shadow:0 3px 10px rgba(0,0,0,.15);border-left:4px solid #c9822f}
#ticker span{display:inline-block}
#ticker span.slide{animation:tick .6s ease-out}
@keyframes tick{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.cityBtns{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.cityBtns button{width:42px;height:42px;border-radius:12px;border:1px solid rgba(110,80,40,.3);background:rgba(246,236,212,.94);font-size:19px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.cityBtns button:active{transform:translateY(1px)}
#miniMap{position:absolute;left:8px;bottom:8px;width:112px;height:112px;border-radius:50%;border:3px solid rgba(246,236,212,.95);box-shadow:0 4px 14px rgba(0,0,0,.35);background:#2a3a3a;cursor:pointer;touch-action:none}
#legend{position:absolute;right:58px;top:8px;width:min(300px,calc(100% - 70px));max-height:calc(100% - 16px);overflow:auto;background:rgba(250,243,226,.97);border-radius:14px;padding:10px;box-shadow:0 6px 20px rgba(0,0,0,.3);font-size:13px}
#legend.hidden{display:none}
.legrow{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed rgba(110,80,40,.2);cursor:pointer}
.legrow .sw{width:22px;height:22px;border-radius:6px;flex:0 0 auto;border:1px solid rgba(0,0,0,.2)}
#cityHint{position:absolute;left:128px;right:8px;bottom:12px;text-align:center;font-size:11.5px;color:#fff6dc;text-shadow:0 1px 3px rgba(0,0,0,.6);pointer-events:none}

/* painted UI */
.pic{display:inline-block;vertical-align:middle;-webkit-user-drag:none;user-select:none}
.pic.ri{height:1.25em;width:auto;filter:drop-shadow(0 1px 1px rgba(40,25,5,.35));margin-right:1px}
.res .pic.ri{height:19px}
.tabi{height:26px;width:auto;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));transition:transform .15s}
nav#tabs button.on .tabi{transform:scale(1.12);filter:drop-shadow(0 0 6px rgba(255,212,107,.7))}
.card{background:linear-gradient(rgba(252,246,230,.82),rgba(244,232,204,.86)),url(assets/t_paper.webp) center/320px;border:1px solid rgba(110,80,40,.35);box-shadow:0 6px 18px rgba(30,20,5,.18),inset 0 0 0 3px rgba(255,250,235,.35),inset 0 0 24px rgba(120,85,40,.18)}
.bld{grid-template-columns:64px 1fr}
.bld .ic{width:64px;height:64px;background:radial-gradient(circle at 50% 60%,rgba(255,240,200,.8),rgba(255,255,255,0) 70%)}
.bld .ic .pic{max-width:64px;max-height:64px;filter:drop-shadow(0 3px 3px rgba(40,25,5,.35))}
.scene.paint{position:relative;line-height:0;background:#2a2218}
.scene.paint .bg{width:100%;height:auto;display:block}
.capscene .win{position:absolute;width:1.4%;height:1.6%;border-radius:2px;background:#ffd46b;box-shadow:0 0 8px 3px rgba(255,200,90,.75);animation:flick 2.6s infinite alternate;mix-blend-mode:screen;opacity:.85}
.capscene .eye{position:absolute;width:1%;height:1%;border-radius:50%;background:#fff1b8;box-shadow:0 0 7px 3px rgba(255,212,107,.9);animation:pulse 2.4s infinite;mix-blend-mode:screen}
.capscene .smoke{position:absolute;left:52%;top:58%;width:7%;height:12%;border-radius:50%;background:radial-gradient(rgba(70,62,58,.55),rgba(70,62,58,0) 70%);animation:smoke 4s linear infinite}
.capscene .smoke.s2{animation-delay:2s}
.capscene .cage{position:absolute;left:81.6%;top:calc(52% + var(--d));width:1.6%;height:3%;background:#5a3e24;border:1px solid #2a1a0a;box-shadow:0 0 6px 2px rgba(255,200,90,.6);animation:cage 6s ease-in-out infinite alternate}
.capscene .chips{position:absolute;left:8px;top:8px;right:8px;display:flex;flex-wrap:wrap;gap:4px;line-height:1.2}
.capscene .chips span{font-size:11.5px;padding:2px 8px;border-radius:99px;background:rgba(24,18,10,.62);color:#fff3d0;backdrop-filter:blur(2px)}
.capscene .cap{position:absolute;left:10px;bottom:8px;font:italic 12px Georgia,serif;color:#fff3d0;text-shadow:0 1px 3px #000;line-height:1.2}
@keyframes flick{from{opacity:.55}to{opacity:.95}}
@keyframes smoke{0%{transform:translate(0,0) scale(.5);opacity:0}20%{opacity:.9}100%{transform:translate(18%,-160%) scale(1.8);opacity:0}}
@keyframes cage{from{transform:translateY(0)}to{transform:translateY(-120%)}}
.herocard{position:relative;padding-left:76px;min-height:96px}
.herocard .portrait{position:absolute;left:8px;bottom:6px;height:92px;width:auto;filter:drop-shadow(0 3px 4px rgba(40,25,5,.4))}
.molescene{margin:8px 0;max-height:150px;overflow:hidden}
.molescene .fighter{position:absolute;left:6%;bottom:2%;height:70%;width:auto;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6));animation:lunge 1.4s ease-in-out infinite}
@keyframes lunge{0%,100%{transform:translateX(0)}50%{transform:translateX(14px) rotate(2deg)}}
.opart{float:right;height:86px;width:auto;margin:-4px -2px 4px 8px;filter:drop-shadow(0 4px 4px rgba(40,25,5,.35))}
.pic.mi{height:22px}
.golemrow{display:flex;gap:2px;margin:4px 0 2px;flex-wrap:wrap}
.golemrow .gs{height:40px;width:auto;filter:drop-shadow(0 2px 2px rgba(40,25,5,.4))}
.rival{position:relative;padding-left:76px;min-height:90px}
.rival .rv{position:absolute;left:6px;top:8px;height:84px;width:auto;filter:drop-shadow(0 3px 4px rgba(40,25,5,.45))}
.pic.pi{height:1.4em}
.pic.petart{height:40px;width:auto;filter:drop-shadow(0 2px 2px rgba(40,25,5,.35))}
.golem2{transform-box:fill-box;transform-origin:50% 100%}
.golem2 .ga{opacity:0}
.wake .golem2 .gs{animation:fadeout .3s forwards;animation-delay:calc(var(--i) * .18s + .3s)}
.wake .golem2 .ga{animation:glow .3s forwards;animation-delay:calc(var(--i) * .18s + .3s)}
.wake .golem2{animation:rise2 .8s cubic-bezier(.3,1.5,.5,1) forwards;animation-delay:calc(var(--i) * .18s)}
@keyframes fadeout{to{opacity:0}}
@keyframes rise2{0%{transform:translateY(0)}55%{transform:translateY(-10px) scale(1.04)}100%{transform:translateY(-3px)}}
#tapzone .hint{color:#fff3d0;text-shadow:0 1px 3px #000,0 0 8px rgba(0,0,0,.6);font-weight:600}
.lt{white-space:nowrap}
#heroG image{filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
#dummyG image{filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="titlebar">
      <h1>Hollowdeep<small>prototype</small></h1>
      <span id="speedPill" class="pill"></span>
      <button class="iconbtn" data-act="settings" aria-label="Settings">⚙️</button>
    </div>
    <div id="resbar"></div>
  </header>
  <main id="view"></main>
  <div id="city" class="hidden">
    <canvas id="cityCanvas" aria-label="Rim City map"></canvas>
    <div id="cityLoader" class="hidden"><div class="ldCard"><div class="ldTitle">🎨 Painting Rim City…</div><div class="ldSub">Unpacking homes, trees and the Hollow</div><div class="ldBar"><i></i></div><div class="ldPct">0%</div></div></div>
    <div class="cityTop">
      <div class="cityTitle">🗺️ Rim City <span id="cityCount" class="dim"></span></div>
      <div id="cityInfo"></div>
      <div id="ticker"><span></span></div>
    </div>
    <div class="cityBtns">
      <button data-city="zin" aria-label="Zoom in">＋</button><button data-city="zout" aria-label="Zoom out">－</button>
      <button data-city="home" aria-label="My Lanternhold">🏠</button><button data-city="overview" aria-label="Whole map">🌐</button>
      <button data-city="legend" aria-label="Legend">📖</button><button data-city="journal" aria-label="Journal">📔</button><button data-city="season" aria-label="Seasons">🍂</button>

<script>
'use strict';
/* =====================================================================
   HOLLOWDEEP — playable prototype
   All tunable numbers live in CONFIG. Times are in GAME hours/minutes;
   TEST MODE multiplies the clock (default 1 game hour = 1 real minute).
   ===================================================================== */
const CONFIG = {

  tap: { weeklyTarget: 300000, dailyCap: 60000, exponent: 0.75, testScale: 0.01, maxTapsPerSec: 12, rollingDays: 7 },

  // Buildings. cost for target level T = base × growth^(T-2) (T=1 for things that start at 0)
  buildings: {

    wall:      { name: 'Guardian Wall',   icon: '🗿', max: 10, base: { crowns: 110, stone: 140 }, growth: 1.55, minutes: 20, steelFrom: 4, steelPer: 8, obsidianFrom: 6, obsidianPer: 4,

    vault:     { name: 'Rim Vault',       icon: '🏦', max: 8, start: 0, base: { crowns: 260, stone: 220 }, growth: 1.6, minutes: 30,
                 desc: 'Deep stone vaults under your Lanternhold. +30% storage cap and +3% raid protection per level. (Public Vaults dot Rim City.)' },
    forge:     { name: 'Rim Forge',       icon: '⚒️', max: 8, start: 0, base: { crowns: 200, stone: 150, timber: 60 }, growth: 1.6, minutes: 25,

  buildTimeGrowth: 1.45,
  hallPerLevel: { crowns: 14, stone: 8, lumen: 2.5, mossPress: 6 },   // per game hour

  lift: { maxReach: 4, capacityPerLevel: 30, pullCutPerLevel: 0.08 },
  wall: { baseGolems: 2, golemEvery: 3, maxGolems: 5, golemPower: 10, golemPowerPerLevel: 7 },
  forgePerLevel: 1.5,

  // Rim City market base prices (Crowns per unit). Buy at price × buyMult, sell at price × sellMult.
  market: { prices: { stone: 1.2, timber: 1.5, lumen: 3, moss: 1, iron: 2, coal: 2, amber: 12, steel: 8, obsidian: 16 }, buyMult: 1.0, sellMult: 0.55, premiumSellMult: 0.85, lot: 20 },
  mapRaid: { lumen: 10, marchMinutes: 30, shieldHours: 6 },                                                 // steel per game hour per level

  // The Hollow. Expedition: hours, lumen cost, recommended power, base risk, xp, loot ranges, pet egg.
  // Outposts: burn = Lumen per hour to keep an outpost lit; pull = Pull multiplier of the layer.
  layers: [
    { id: 1, name: 'The Lip', color: '#d9b46a', flavor: 'Sunlit ledges and old gold seams just under the rim.',
      hours: 1, lumen: 5, rec: 20, risk: 0.05, xp: 30, loot: { crowns: [40, 80], stone: [20, 40], timber: [10, 25] }, pet: 'wisp', egg: 0.12, burn: 0.5, pull: 1.0,
      veins: [ { id: 'l1gold', name: 'Gold Vein', prod: { crowns: 12 } }, { id: 'l1chalk', name: 'Chalk Ledge', prod: { stone: 10 } } ] },
    { id: 2, name: 'Lanternmoss Terraces', color: '#7fb07a', flavor: 'Glowing moss terraces. The fuel of everything below.',
      hours: 3, lumen: 10, rec: 45, risk: 0.12, xp: 90, loot: { lumen: [15, 30], moss: [20, 40], crowns: [20, 40] }, pet: 'pup', egg: 0.10, burn: 1, pull: 1.25,
      veins: [ { id: 'l2moss', name: 'Lanternmoss Bed', prod: { moss: 10 } }, { id: 'l2clay', name: 'Clay Shelf', prod: { stone: 11, moss: 2 } } ] },
    { id: 3, name: 'Rootfall', color: '#c08a4a', flavor: 'A forest growing down the wall. Amber weeps from the roots.',
      hours: 6, lumen: 20, rec: 80, risk: 0.22, xp: 200, loot: { timber: [30, 60], amber: [2, 5], iron: [10, 20], steel: [3, 6] }, pet: 'moth', egg: 0.10, burn: 2, pull: 1.6,
      veins: [ { id: 'l3wood', name: 'Heartwood Grove', prod: { timber: 10 } }, { id: 'l3amber', name: 'Amber Weep', prod: { amber: 0.8, timber: 3 } } ] },
    { id: 4, name: 'The Bellows', color: '#b0573a', flavor: 'The Hollow breathes here. Iron, Breathcoal, and hot wind.',
      hours: 10, lumen: 35, rec: 130, risk: 0.32, xp: 420, loot: { iron: [30, 60], coal: [20, 40], steel: [6, 12], amber: [3, 6], obsidian: [1, 4] }, pet: 'ferret', egg: 0.10, burn: 3, pull: 2.0,
      veins: [ { id: 'l4iron', name: 'Iron Seam', prod: { iron: 8, coal: 2 } }, { id: 'l4coal', name: 'Breathcoal Vent', prod: { coal: 8, iron: 2 } } ] },
  ],
  veinDecayPerDay: 0.04, veinMin: 0.35, veinRegenPerDay: 0.08,
  seasonedDays: 7, seasonedBonus: 0.10, darkOutput: 0.25,

  outpostTypes: {
    strider: { name: 'Strider', icon: '🦿', mult: 1.0, defense: 25, stockCap: 300, unanchorH: 3, travelHPerLayer: 2, settleH: 2,
               desc: 'A workshop on four stilt legs. Balanced all-rounder.' },
    drill:   { name: 'Tetherdrill', icon: '⛏️', mult: 1.3, defense: 15, stockCap: 240, unanchorH: 2, travelHPerLayer: 1, settleH: 1,
               desc: 'Hangs off your Spine. Highest output, fast to move, thin armor.',
               cost: { crowns: 500, stone: 250, timber: 120, steel: 15 }, needsLift: 2 },
  },
  moveCost: { crowns: 60, lumenPerLayer: 10 },     // moving deeper costs more Lumen (the Pull)

  modules: {
    still:   { name: 'Lumen Still', icon: '⚗️', cost: { crowns: 120, timber: 40 }, in: { moss: 2 }, out: { lumen: 1 }, perHour: 5,
               desc: 'Presses 2 Lanternmoss → 1 Lumen aboard (capital presses only 3:1).' },
    smelter: { name: 'Smelter',     icon: '🔥', cost: { crowns: 200, stone: 120, timber: 60 }, in: { iron: 2, coal: 1 }, out: { steel: 1 }, perHour: 3,
               desc: 'Smelts 2 Iron + 1 Breathcoal → 1 Steel aboard. Pulls inputs from your other outposts on the same layer.' },
  },

  pull: { scale: 0.25, shipEveryHours: 1 },   // Lumen cost = qty × weight × layer depth × layer pull × scale × (1 − lift cut) × pets

  pets: {
    wisp:   { name: 'Chalk Wisp',     icon: '👻', power: 9, bonus: 'Sturdy defender (+power)' },
    pup:    { name: 'Moss Pup',       icon: '🐶', power: 6, bonus: '+20% Lumen from expeditions', lumenFind: 0.20 },
    moth:   { name: 'Amber Moth',     icon: '🦋', power: 7, bonus: '+15% expedition loot', loot: 0.15 },
    ferret: { name: 'Bellows Ferret', icon: '🦦', power: 8, bonus: 'Hauler: −20% Pull cost', pullCut: 0.20 },
  },
  petLevelPower: 0.4, petMax: 10, petUpgrade: { crowns: 60, amber: 2 },
  kennelPetBoost: 0.10,

  raids: {
    firstRaidHours: 1.5, intervalHours: [8, 14], shieldHours: 8,
    attackLumen: 10, marchMinutes: 30, rivalShieldHours: 4,
    lootPct: 0.30,                          // share of UNPROTECTED stock taken at 3 stars
    outpostBaitChance: 0.5, outpostLootPct: 0.4,
    growthPerDay: 0.04,                     // AI raiders slowly get stronger
    heroHomeDefense: 0.5, petDefense: 0.6,
  },
  rivals: [
    { name: 'Hookline Rest',  lord: 'Vessa the Ropewright', icon: '🪝', mult: 0.7 },
    { name: 'Cinderbell Keep',lord: 'Old Marrow',          icon: '🔔', mult: 1.0 },
    { name: 'Mothwick Hold',  lord: 'The Pale Lodge',      icon: '🕯️', mult: 1.35 },
  ],
};

const HOUR = 3600e3, MIN = 60e3, DAY = 24 * HOUR;
const RES = Object.keys(CONFIG.resources);
let S = null;                 // game state
let ui = { tab: 'city', pressing: false, lastHtml: '', modal: null, collecting: null };

/* ---------------- helpers ---------------- */
const $ = (s) => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const speed = () => (S.testMode ? CONFIG.testMode.speed : 1);
const layerById = (id) => CONFIG.layers[id - 1];
function veinById(id) { for (const L of CONFIG.layers) for (const v of L.veins) if (v.id === id) return Object.assign({ layer: L.id }, v); return null; }
function fmt(n) { n = Math.floor(n + 1e-9); if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M'; if (n >= 1e4) return (n / 1e3).toFixed(1) + 'k'; return String(n); }
function fmt1(n) { return n >= 10 ? fmt(n) : (Math.round(n * 10) / 10).toString(); }
function fmtDur(ms) {
  ms = Math.max(0, ms); const s = Math.ceil(ms / 1000);
  if (s < 60) return s + 's';
  const m = Math.floor(s / 60), h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (d > 0) return d + 'd ' + (h % 24) + 'h';
  if (h > 0) return h + 'h ' + (m % 60) + 'm';
  return m + 'm ' + (s % 60) + 's';
}
const realLeft = (end) => fmtDur((end - S.gameTime) / speed());
const gameDur = (ms) => fmtDur(ms) + (S.testMode ? ` <span class="dim">(≈${fmtDur(ms / speed())} real)</span>` : '');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------------- state ---------------- */
function newState() {
  const veins = {}; CONFIG.layers.forEach((L) => L.veins.forEach((v) => (veins[v.id] = 1)));
  const buildings = {}; for (const k in CONFIG.buildings) buildings[k] = CONFIG.buildings[k].start ?? 1;
  return {
    v: 1, testMode: CONFIG.testMode.defaultOn, gameTime: 0, lastReal: Date.now(), created: Date.now(),
    res: Object.assign({}, CONFIG.start), buildings, build: null,
    hero: { level: 1, xp: 0, task: null },
    taps: { days: {}, total: 0, marks: 0 },
    pets: [{ uid: 1, id: 'pup', level: 1 }], slots: [1, null],
    outposts: [{ uid: 2, type: 'strider', name: 'Longstep', layer: 1, vein: 'l1gold', state: 'anchored', anchoredSince: 0, stock: {}, module: null, ship: 'all', move: null, dark: false }],
    veins, nextShipAt: HOUR * CONFIG.pull.shipEveryHours, lastShip: null,
    nextRaidAt: CONFIG.raids.firstRaidHours * HOUR, shieldUntil: 0, raidCount: 0, lastRaid: null, pendingReveal: null,
    rivals: [], log: [], nextUid: 10, seen: {},
    mapShields: {}, moleDone: {}, discovered: {}, journal: [], seasonOverride: null, festivalOverride: false, cityCam: null,
    stats: { expeditions: 0, raidsWon: 0, defended: 0, tapsAll: 0, deepest: 0, moles: 0 },
  };
}
function uid() { return S.nextUid++; }

function log(icon, msg) {
  const e = { t: S.gameTime, icon, msg };
  S.log.unshift(e); if (S.log.length > 80) S.log.length = 80;
  if (ui.collecting) ui.collecting.push(e);
  else toast(icon + ' ' + msg.replace(/<[^>]+>/g, ''));
}

/* ---------------- derived numbers ---------------- */
function storageCap() { const c = CONFIG.storage; return Math.floor(c.base * Math.pow(c.growth, S.buildings.storehouse - 1) * (1 + CONFIG.vault.capPerLevel * (S.buildings.vault || 0))); }
function protectedShare() { const c = CONFIG.storage; return clamp(c.protectBase + c.protectPerLevel * (S.buildings.storehouse - 1) + CONFIG.vault.protectPerLevel * (S.buildings.vault || 0), 0, 0.85); }
function addRes(k, n) { S.res[k] = clamp((S.res[k] || 0) + n, 0, storageCap()); }
function canAfford(cost) { return Object.keys(cost).every((k) => (S.res[k] || 0) >= cost[k] - 1e-9); }
function pay(cost) { if (!canAfford(cost)) return false; for (const k in cost) S.res[k] -= cost[k]; return true; }
function liftReach() { return Math.min(CONFIG.lift.maxReach, S.buildings.lift + 1); }      // deepest layer outposts can anchor
function expeditionReach() { return Math.min(CONFIG.layers.length, liftReach() + 1); }       // hero can scout one layer deeper
function liftCapacity() { return CONFIG.lift.capacityPerLevel * S.buildings.lift; }
function golemCount() { const w = CONFIG.wall; return Math.min(w.maxGolems, w.baseGolems + Math.floor((S.buildings.wall - 1) / w.golemEvery)); }
function golemPower() { const w = CONFIG.wall; return w.golemPower + w.golemPowerPerLevel * (S.buildings.wall - 1); }
function petSlots() { return S.buildings.kennel >= 3 ? 2 : 1; }
function equippedPets() { return S.slots.slice(0, petSlots()).map((u) => S.pets.find((p) => p.uid === u)).filter(Boolean); }
function petPower(p) { const d = CONFIG.pets[p.id]; return d.power * (1 + CONFIG.petLevelPower * (p.level - 1)) * (1 + CONFIG.kennelPetBoost * (S.buildings.kennel - 1)); }
function petsPower() { return equippedPets().reduce((a, p) => a + petPower(p), 0); }
function petBonus(key) { return equippedPets().reduce((a, p) => a + (CONFIG.pets[p.id][key] || 0), 0); }
function heroBasePower() { const h = CONFIG.hero; return h.basePower + h.powerPerLevel * (S.hero.level - 1) + CONFIG.trainingPerLevel.power * (S.buildings.training - 1); }
function attackPower() { return heroBasePower() + petsPower(); }
function heroHome() { return !S.hero.task; }
function defensePower() {
  const r = CONFIG.raids;
  return golemCount() * golemPower() + petsPower() * r.petDefense + (heroHome() ? heroBasePower() * r.heroHomeDefense : 0);
}
function xpToNext(l) { const h = CONFIG.hero; return Math.floor(h.xpBase * Math.pow(h.xpGrowth, (l || S.hero.level) - 1)); }

/* ---------- training boost (rolling 7-day bank) ---------- */
function tapScale() { return S.testMode ? CONFIG.tap.testScale : 1; }
function dayIndex() { return Math.floor(S.gameTime / DAY); }
function tapsToday() { return S.taps.days[dayIndex()] || 0; }
function dailyCap() { return Math.round(CONFIG.tap.dailyCap * tapScale()); }
function weeklyTarget() { return Math.round(CONFIG.tap.weeklyTarget * tapScale()); }
function weekTaps() { const d = dayIndex(); let s = 0; for (const k in S.taps.days) if (+k > d - CONFIG.tap.rollingDays) s += S.taps.days[k]; return s; }
function boostFor(t) { return 100 * Math.pow(Math.min(1, t / weeklyTarget()), CONFIG.tap.exponent); }
function boostPct() { return boostFor(weekTaps()); }
function pruneTaps() { const d = dayIndex(); for (const k in S.taps.days) if (+k <= d - CONFIG.tap.rollingDays) delete S.taps.days[k]; }

function gainXp(amount, quiet) {
  const gained = amount * (1 + boostPct() / 100);
  S.hero.xp += gained;
  let ups = 0;
  while (S.hero.xp >= xpToNext()) { S.hero.xp -= xpToNext(); S.hero.level++; ups++; }
  if (ups) log('⭐', `${CONFIG.hero.name} reached <b>level ${S.hero.level}</b>!`);
  return gained;
}

/* ---------------- buildings ---------------- */
function buildCost(id) {
  const b = CONFIG.buildings[id], target = S.buildings[id] + 1, mult = Math.pow(b.growth, Math.max(0, target - 2));
  const c = {}; for (const k in b.base) c[k] = Math.round(b.base[k] * mult);
  if (b.steelFrom && target >= b.steelFrom) c.steel = b.steelPer * (target - b.steelFrom + 1);
  if (b.amberFrom && target >= b.amberFrom) c.amber = b.amberPer * (target - b.amberFrom + 1);
  if (b.obsidianFrom && target >= b.obsidianFrom) c.obsidian = b.obsidianPer * (target - b.obsidianFrom + 1);
  return c;
}
function buildTime(id) { const b = CONFIG.buildings[id], target = S.buildings[id] + 1; return b.minutes * MIN * Math.pow(CONFIG.buildTimeGrowth, Math.max(0, target - 2)); }
function buildBlock(id) {
  const b = CONFIG.buildings[id], lvl = S.buildings[id];
  if (lvl >= b.max) return 'Max level';
  if (id !== 'hall' && lvl + 1 > S.buildings.hall + 1) return `Needs Lantern Hall Lv ${lvl}`;
  if (S.build) return 'Builders busy';
  return null;
}
function startBuild(id) {
  if (buildBlock(id)) return;
  const cost = buildCost(id);
  if (!pay(cost)) return toast('Not enough resources');
  S.build = { id, to: S.buildings[id] + 1, start: S.gameTime, end: S.gameTime + buildTime(id) };
  toast(`🔨 Building ${CONFIG.buildings[id].name} Lv ${S.build.to}`);
  rerender(true);
}

/* ---------------- expeditions ---------------- */
function successChance(L) { return clamp(1 - L.risk + ((attackPower() - L.rec) / L.rec) * 0.3, 0.2, 0.97); }
function startExpedition(layerId) {
  const L = layerById(layerId);
  if (!heroHome()) return toast('Your hero is busy');
  if (layerId > expeditionReach()) return toast('The Tether does not reach that deep yet');
  if (!pay({ lumen: L.lumen })) return toast(`Needs ${L.lumen} Lumen to light the way`);
  S.hero.task = { type: 'expedition', layer: layerId, start: S.gameTime, end: S.gameTime + L.hours * HOUR };
  toast(`🕳️ ${CONFIG.hero.name} descends into ${L.name}`);
  rerender(true);
}
function rollLoot(L, mult) {
  const out = {};
  for (const k in L.loot) { let n = rand(L.loot[k][0], L.loot[k][1]) * mult; if (k === 'lumen') n *= 1 + petBonus('lumenFind'); out[k] = Math.round(n); }
  return out;
}
function lootText(l) { return Object.keys(l).filter((k) => l[k] > 0).map((k) => `${CONFIG.resources[k].icon}${fmt(l[k])}`).join(' '); }
function grantLoot(l) { for (const k in l) addRes(k, l[k]); }
function findPet(L) {
  if (Math.random() < L.egg) {
    const p = { uid: uid(), id: L.pet, level: 1 };
    const dupe = S.pets.find((x) => x.id === L.pet);
    if (dupe) { dupe.level = Math.min(CONFIG.petMax, dupe.level + 1); log('🥚', `Found another ${CONFIG.pets[L.pet].name} egg. Your ${CONFIG.pets[L.pet].name} grew to Lv ${dupe.level}!`); }
    else { S.pets.push(p); log('🥚', `Found a pet egg! <b>${CONFIG.pets[L.pet].icon} ${CONFIG.pets[L.pet].name}</b> hatched.`); if (!S.slots[0]) S.slots[0] = p.uid; }
  }
}
function finishHeroTask() {
  const t = S.hero.task;
  if (t.type === 'expedition') {
    const L = layerById(t.layer);
    const mult = (1 + 0.03 * (S.hero.level - 1)) * (1 + petBonus('loot'));
    const loot = rollLoot(L, mult);
    if (Math.random() < successChance(L)) {
      grantLoot(loot); const xp = gainXp(L.xp);
      S.stats.expeditions++; S.stats.deepest = Math.max(S.stats.deepest || 0, t.layer);
      log('🎒', `Back from <b>${L.name}</b>: ${lootText(loot)} · +${fmt(xp)} XP`);
      findPet(L);
      S.hero.task = null;
    } else {
      const half = {}; for (const k in loot) half[k] = Math.floor(loot[k] / 2);
      S.hero.task = { type: 'stranded', layer: t.layer, start: S.gameTime, end: S.gameTime + L.hours * HOUR * 0.5, loot: half, xp: L.xp / 2 };

  const h = dt / HOUR; S.gameTime += dt;
  const lv = S.buildings.hall, H = CONFIG.hallPerLevel;
  addRes('crowns', H.crowns * lv * h); addRes('stone', H.stone * lv * h); addRes('lumen', H.lumen * lv * h);
  const press = Math.min(S.res.moss, H.mossPress * lv * h); if (press > 0) { S.res.moss -= press; addRes('lumen', press / 3); }
  if (S.buildings.forge > 0) {
    const n = Math.min(CONFIG.forgePerLevel * S.buildings.forge * h, S.res.iron / 2, S.res.coal);
    if (n > 0) { S.res.iron -= 2 * n; S.res.coal -= n; addRes('steel', n); }
  }
  if (heroHome()) gainXp(CONFIG.trainingPerLevel.sparXp * S.buildings.training * h);
  if (S.build && S.gameTime >= S.build.end) {
    S.buildings[S.build.id] = S.build.to;
    log(CONFIG.buildings[S.build.id].icon, `<b>${CONFIG.buildings[S.build.id].name}</b> upgraded to Lv ${S.build.to}.`);
    S.build = null;
  }
  if (S.hero.task && S.gameTime >= S.hero.task.end) finishHeroTask();
  for (const o of S.outposts) updateOutpost(o, h);
  const used = new Set(S.outposts.map((o) => o.vein));
  for (const k in S.veins) if (!used.has(k)) S.veins[k] = Math.min(1, S.veins[k] + CONFIG.veinRegenPerDay * h / 24);
  while (S.gameTime >= S.nextShipAt) { shipAll(); S.nextShipAt += CONFIG.pull.shipEveryHours * HOUR; }
  if (S.gameTime >= S.nextRaidAt) aiRaid();
  pruneTaps();
}
function simulate(dtGame) {
  const stepMs = CONFIG.simStepMinutes * MIN;
  while (dtGame > 0) { const d = Math.min(stepMs, dtGame); step(d); dtGame -= d; }
}
// Runs a chunk of time "while away" and returns a summary
function simulateAway(dtGame) {
  const before = Object.assign({}, S.res), lvl = S.hero.level;
  const capped = Math.min(dtGame, CONFIG.offlineCapHours * HOUR);
  ui.collecting = [];
  simulate(capped);
  const events = ui.collecting; ui.collecting = null;
  const delta = {}; for (const k of RES) { const d = (S.res[k] || 0) - (before[k] || 0); if (Math.abs(d) >= 1) delta[k] = d; }
  return { gameMs: capped, cappedFrom: dtGame, delta, events, levels: S.hero.level - lvl };
}

/* ---------------- save / load ---------------- */
function save() { S.lastReal = Date.now(); try { localStorage.setItem(CONFIG.saveKey, JSON.stringify(S)); } catch (e) { /* storage full or blocked */ } }
function load() {
  try { const raw = localStorage.getItem(CONFIG.saveKey); if (!raw) return null; const s = JSON.parse(raw); if (!s || s.v !== 1) return null; const d = newState(); s.buildings = Object.assign(d.buildings, s.buildings || {}); s.res = Object.assign(Object.fromEntries(RES.map((k) => [k, 0])), s.res || {}); return Object.assign(d, s); } catch (e) { return null; }
}
function resetSave() { localStorage.removeItem(CONFIG.saveKey); S = newState(); ensureRivals(); closeModal(); rerender(true); toast('Fresh start. Welcome to the Rim.'); }

    case 'storehouse': { const c = CONFIG.storage; return `cap ${fmt(c.base * Math.pow(c.growth, lvl - 1))} · protects ${Math.round(clamp(c.protectBase + c.protectPerLevel * (lvl - 1), 0, .8) * 100)}%`; }
    case 'training': return `+${CONFIG.trainingPerLevel.power * (lvl - 1)} power · spar ${CONFIG.trainingPerLevel.sparXp * lvl} XP/h`;
    case 'lift': return `reach layer ${Math.min(CONFIG.lift.maxReach, lvl + 1)} · ${CONFIG.lift.capacityPerLevel * lvl} wt/h · Pull −${Math.round(CONFIG.lift.pullCutPerLevel * (lvl - 1) * 100)}%`;

/* ---------- render loop ---------- */
const VIEWS = { city: () => '', capital: viewCapital, hollow: viewHollow, outposts: viewOutposts, raids: viewRaids, training: viewTraining };
function rerender(force) {
  renderResbar();
  document.querySelectorAll('nav#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === ui.tab));
  if (ui.tab === 'city') { $('#view').style.display = 'none'; CityMap.show(); return; }
  $('#view').style.display = ''; CityMap.hide();
  if (ui.tab === 'training' && !force && document.getElementById('tapzone')) {
    updateTrainingBinds();
    if (!ui.pressing) for (const [id, fn] of [['heroSlot', heroStatusCard], ['petSlot', petsCard]]) { const el = document.getElementById(id), hh = fn(); if (el && el.dataset.h !== hh) { el.dataset.h = hh; el.innerHTML = hh; } }
    return;
  }
  if (ui.pressing && !force) return;
  const html = VIEWS[ui.tab]();
  if (force || html !== ui.lastHtml) { ui.lastHtml = html; $('#view').innerHTML = html; }
  if (ui.tab === 'training') updateTrainingBinds();
}
function updateLive() {
  document.querySelectorAll('[data-end]').forEach((e) => { const v = realLeft(+e.dataset.end); if (e.textContent !== v) e.textContent = v; });
  document.querySelectorAll('[data-pstart]').forEach((e) => { e.style.width = clamp((S.gameTime - +e.dataset.pstart) / Math.max(1, +e.dataset.pend - +e.dataset.pstart), 0, 1) * 100 + '%'; });
}
function setTab(t) { ui.tab = t; ui.lastHtml = ''; rerender(true); window.scrollTo(0, 0); }

let lastRender = 0, lastSave = 0;
function tick() {
  const now = Date.now(), realDt = now - S.lastReal;
  S.lastReal = now;
  if (realDt <= 0) return;
  if (realDt > CONFIG.awayThresholdRealSec * 1000) {
    const sum = simulateAway(realDt * speed());
    awayModal(sum, realDt); rerender(true); save(); return;
  }
  simulate(realDt * speed());
  updateLive();
  if (now - lastRender > 1000) { lastRender = now; rerender(false); }
  if (now - lastSave > 5000) { lastSave = now; save(); }
}

/* ---------- input ---------- */
function onAct(act, ds) {
  switch (act) {
    case 'build': return startBuild(ds.id);
    case 'exp': return startExpedition(+ds.id);
    case 'rescue': return rescueNow();
    case 'attack': return startAttack(+ds.id);
    case 'ship': return shipNow(+ds.uid);
    case 'shipmode': { const o = S.outposts.find((x) => x.uid === +ds.uid); o.ship = ds.id; return rerender(true); }
    case 'module': return installModule(+ds.uid, ds.id);
    case 'movemenu': return moveMenu(+ds.uid);
    case 'move': return startMove(+ds.uid, ds.id);
    case 'drill': return buildDrill();
    case 'equip': return equipPet(+ds.uid);
    case 'petup': return petUp(+ds.uid);
    case 'replay': return showReveal(S.lastRaid);
    case 'raidnow': S.shieldUntil = 0; S.nextRaidAt = S.gameTime; ui.collecting = null; aiRaid(); return rerender(true);
    case 'settings': return settingsModal();
    case 'close': return closeModal();
    case 'toggletest': S.testMode = !S.testMode; save(); settingsModal(); return rerender(true);
    case 'skip': { const sum = simulateAway(+ds.id * HOUR); closeModalQuiet(); awayModal(sum, null); save(); return rerender(true); }
    case 'reset': if (confirm('Reset all Hollowdeep progress?')) resetSave(); return;
    case 'journal': closeModalQuiet(); setTab('city'); setTimeout(() => { const b = document.querySelector('[data-city=journal]'); if (b) b.click(); }, 60); return;
    default: return CityMap.onAct(act, ds);
  }
}

  const L = seasonLen(), t = gTime(); return { idx: Math.floor(t / L) % 4, prog: (t % L) / L, nextIn: L - (t % L) };

      <div class="dim">The cycle: 🌸 Bloomtide → ☀️ Lumen Summer (Lumen Festival late in the season) → 🍂 Ambertide (Harvest Fair mid-season) → ❄️ Frostfall (frost creeps over the Bluffs). Each season lasts ${S.testMode ? CITY.testSeasonDays : CITY.seasonDays} game day(s)${S.testMode ? ' in test mode' : ''}.</div>
      <div class="small" style="margin-top:8px"><b>Debug</b></div>
      ${btnRow(`<button class="btn ghost sm" data-act="season" data-id="next">Next season ⏭</button><button class="btn ghost sm" data-act="season" data-id="fest">${S.festivalOverride ? 'Festival OFF' : 'Force festival 🎉'}</button><button class="btn ghost sm" data-act="season" data-id="night">Skip to dusk 🌆</button><button class="btn ghost sm" data-act="season" data-id="deep">Nightfall 🌙</button><button class="btn ghost sm" data-act="season" data-id="auto">Follow clock ↺</button>`)}
      ${btnRow('<button class="btn ghost" data-act="close">Close</button>')}`, 'city');
  }
  function onAct(act, ds) {
    switch (act) {
      case 'mapraid': { const h = W.homes[+ds.id]; closeModalQuiet(); discoverRegion(h.region); return startMapRaid(h); }
      case 'mapvisit': { const h = W.homes[+ds.id]; toast(`👋 ${h.owner} waves from the window. (Visiting is coming soon.)`); return; }
      case 'mbuy': marketBuy(ds.id, +ds.n, +ds.m); if (marketCard.last) marketCard(marketCard.last); return;
      case 'msell': marketSell(ds.id, +ds.n, +ds.m); if (marketCard.last) marketCard(marketCard.last); return;
      case 'mopen': return marketCard(W.markets[+ds.id]);
      case 'vopen': return vaultCard(W.vaults[0]);
      case 'gotab': closeModalQuiet(); return setTab(ds.id);
      case 'npcmore': { const n = W.npcs.find((x) => x.npc.id === ds.id); return npcCard(n, performance.now() / 1000); }
      case 'molefight': { const m = currentMole(); if (!m) return toast('The mole has gone back down.'); closeModalQuiet(); return startMoleFight(m); }
      case 'season': { if (ds.id === 'next') { const si = seasonInfo(); S.seasonOverride = (si.idx + 1) % 4; }
        else if (ds.id === 'fest') { S.festivalOverride = !S.festivalOverride; if (S.seasonOverride == null) S.seasonOverride = seasonInfo().idx; if (S.festivalOverride && S.seasonOverride !== 1 && S.seasonOverride !== 2) S.seasonOverride = 1; }
        else if (ds.id === 'deep') { const h = hourOfDay(); simulate(((19.4 - h + 24) % 24) * HOUR); toast('🌙 Skipped ahead to nightfall'); }
        else if (ds.id === 'night') { const h = hourOfDay(); const d = ((17.6 - h + 24) % 24) * HOUR; simulate(d); toast('🌆 Skipped ahead to dusk'); }
        else { S.seasonOverride = null; S.festivalOverride = false; }
        save(); return seasonModal(); }
    }
    return false;
  }
  return { show, hide, onAct, flyTo, cam, st, get fps() { return fps; }, w2s, s2w, handleTap, get tiles() { return tiles.size; }, homeCard, marketCard, currentRumor: () => currentRumor };
})();
</script>
</body></html>
