<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2f4a5c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2246%22 fill=%22%23f6ecd4%22/%3E%3Cellipse cx=%2250%22 cy=%2254%22 rx=%2230%22 ry=%2222%22 fill=%22%231c2140%22/%3E%3Ccircle cx=%2250%22 cy=%2254%22 r=%228%22 fill=%22%23ffd46b%22/%3E%3C/svg%3E">
<title>Hollowdeep — Playable Prototype</title>
<style>
:root{
  --paper:#f6ecd4; --paper2:#efe0bd; --ink:#3a2e22; --ink2:#6b5a45; --dim:#8f7d63;
  --lumen:#ffd46b; --moss:#7fb07a; --deep:#24324a; --rust:#b0573a; --teal:#4f8c8a;
  --good:#4d8a4f; --bad:#b0473a; --accent:#c9822f; --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
  background:
    radial-gradient(ellipse at 20% 0%,rgba(255,236,190,.9),transparent 55%),
    radial-gradient(ellipse at 90% 30%,rgba(140,190,170,.35),transparent 50%),
    linear-gradient(180deg,#f1e2bf 0%,#cdbf96 18%,#86ab9c 42%,#3f6170 70%,#1b2436 100%) fixed;
  overscroll-behavior:none;
}
h1,h2,h3{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;margin:0;font-weight:600}
#app{max-width:540px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header#top{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 8px) 12px 6px;
  background:linear-gradient(180deg,rgba(246,236,212,.97),rgba(239,224,189,.93));
  border-bottom:1px solid rgba(110,80,40,.25);box-shadow:0 4px 18px rgba(40,30,10,.15)}
.titlebar{display:flex;align-items:center;gap:8px}
.titlebar h1{font-size:21px;letter-spacing:.5px;flex:1}
.titlebar h1 small{font:12px system-ui;color:var(--dim);margin-left:6px}
.pill{font-size:11px;padding:3px 8px;border-radius:99px;background:#e2cf9f;color:var(--ink);border:1px solid rgba(110,80,40,.3);white-space:nowrap}
.pill.test{background:#ffe08a;font-weight:700}
.iconbtn{border:0;background:rgba(255,255,255,.55);border-radius:12px;font-size:19px;width:38px;height:38px;cursor:pointer}
#resbar{display:flex;gap:6px;overflow-x:auto;padding:6px 0 2px;scrollbar-width:none}
#resbar::-webkit-scrollbar{display:none}
.res{flex:0 0 auto;display:flex;align-items:center;gap:3px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.6);font-size:13px;font-variant-numeric:tabular-nums;border:1px solid rgba(110,80,40,.15)}
.res.full{background:#f4c9b8}
main#view{flex:1;padding:10px 10px 96px}
nav#tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:center;
  background:linear-gradient(180deg,rgba(30,40,58,.92),rgba(20,26,40,.98));padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);border-top:1px solid rgba(255,212,107,.25)}
nav#tabs .wrap{display:flex;max-width:540px;width:100%}
nav#tabs button{flex:1;border:0;background:none;color:#cfc3a6;font-size:11px;padding:4px 0;cursor:pointer;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
nav#tabs button span{font-size:21px;line-height:1.1}
nav#tabs button.on{color:var(--lumen);background:rgba(255,212,107,.1)}
nav#tabs button .dot{position:absolute;top:2px;right:24%;width:8px;height:8px;border-radius:50%;background:#ff8a5c;box-shadow:0 0 6px #ff8a5c}
.card{background:radial-gradient(circle at 15% 8%,rgba(255,252,240,.97),rgba(246,236,212,.95) 60%,rgba(236,222,190,.95));
  border-radius:var(--radius);padding:12px;margin:0 0 10px;border:1px solid rgba(110,80,40,.22);box-shadow:0 6px 18px rgba(30,20,5,.18)}
.card h2{font-size:18px;margin-bottom:4px}
.card h3{font-size:16px}
.row{display:flex;align-items:center;gap:8px}
.row.between{justify-content:space-between}
.wrapgap{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dim{color:var(--dim);font-size:12.5px}
.small{font-size:12.5px}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;background:#e9dab4;border:1px solid rgba(110,80,40,.2);margin-right:3px;white-space:nowrap}
.tag.good{background:#d3e8c9}.tag.bad{background:#f2cfc4}.tag.lumen{background:#fff0bf}
.cost{display:inline-flex;gap:2px;align-items:center;font-size:12.5px;padding:1px 6px;border-radius:8px;background:rgba(255,255,255,.6);margin:1px 2px 1px 0;font-variant-numeric:tabular-nums}
.cost.short{background:#f6c8bb;color:#7a2a1a}
.btn{border:0;border-radius:12px;padding:10px 14px;font:600 14px system-ui;cursor:pointer;color:#fff8e6;
  background:linear-gradient(180deg,#d39444,#a8682a);box-shadow:0 3px 0 #7a4a1c,0 4px 10px rgba(0,0,0,.18);min-height:42px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #7a4a1c}
.btn.alt{background:linear-gradient(180deg,#5f9c98,#3f706f);box-shadow:0 3px 0 #2a4b4a}
.btn.deep{background:linear-gradient(180deg,#43577a,#28354f);box-shadow:0 3px 0 #18223a}
.btn.red{background:linear-gradient(180deg,#c8634c,#94402e);box-shadow:0 3px 0 #6a2a1c}
.btn.ghost{background:rgba(255,255,255,.6);color:var(--ink);box-shadow:0 2px 0 rgba(110,80,40,.3)}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}
.btn:disabled{filter:grayscale(.8);opacity:.55;cursor:not-allowed;transform:none}
.bar{height:9px;border-radius:9px;background:rgba(80,60,30,.15);overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#e8b45a,#ffd46b);box-shadow:0 0 8px rgba(255,212,107,.8);transition:width .25s linear}
.bar.xp>i{background:linear-gradient(90deg,#6aa36a,#a8d68a)}
.bar.rich>i{background:linear-gradient(90deg,#8a6b3a,#d9b46a)}
.bar.boost>i{background:linear-gradient(90deg,#c9822f,#ffcf5a,#fff1b8)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:rgba(255,255,255,.55);border-radius:12px;padding:8px;text-align:center}
.stat b{display:block;font:600 19px Georgia,serif}
.stat span{font-size:11.5px;color:var(--dim)}
.scene{border-radius:var(--radius);overflow:hidden;margin-bottom:10px;box-shadow:0 6px 18px rgba(30,20,5,.25);border:1px solid rgba(110,80,40,.3);line-height:0}
.scene svg{width:100%;height:auto;display:block}
.bld{display:grid;grid-template-columns:44px 1fr;gap:10px}
.bld .ic{font-size:30px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:rgba(255,255,255,.55)}
.lvl{font:600 12px system-ui;color:#fff;background:#8a6a3a;border-radius:8px;padding:1px 6px;margin-left:4px}
.layer{border-left:6px solid var(--c,#999)}
.locked{opacity:.6}
.log{max-height:300px;overflow:auto}
.log div{padding:5px 0;border-bottom:1px dashed rgba(110,80,40,.2);font-size:13px}
.log .t{color:var(--dim);font-size:11px;margin-right:4px}
.segs{display:flex;gap:4px}
.segs button{flex:1}
/* training */
#tapzone{position:relative;user-select:none;-webkit-user-select:none;touch-action:manipulation;cursor:pointer;border-radius:var(--radius);overflow:hidden;
  background:radial-gradient(ellipse at 50% 120%,#a9c48a 0%,#7ea36f 35%,transparent 36%),linear-gradient(180deg,#f7e6bd,#e6cf98 60%,#cdb47c);border:1px solid rgba(110,80,40,.3);box-shadow:inset 0 0 30px rgba(120,80,20,.25)}
#tapzone svg{width:100%;display:block}
#tapzone .hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:13px;color:#5a4528;pointer-events:none}
.float{position:absolute;pointer-events:none;font:700 18px Georgia,serif;color:#a25c12;text-shadow:0 1px 0 #fff6d8;animation:floatup .9s ease-out forwards}
.float.mark{color:#6a4fa0}
@keyframes floatup{from{opacity:1;transform:translate(-50%,0) scale(1)}to{opacity:0;transform:translate(-50%,-60px) scale(1.25)}}
#swordArm{transform-box:fill-box;transform-origin:10% 90%;transform:rotate(-55deg)}
#swordArm.swing{animation:swing .22s ease-out}
@keyframes swing{0%{transform:rotate(-70deg)}45%{transform:rotate(45deg)}100%{transform:rotate(-55deg)}}
#dummyG{transform-box:fill-box;transform-origin:50% 100%}
#dummyG.hit{animation:wobble .3s ease-out}
@keyframes wobble{0%{transform:rotate(0)}30%{transform:rotate(9deg)}60%{transform:rotate(-5deg)}100%{transform:rotate(0)}}
.spark{animation:spark .3s ease-out forwards}
@keyframes spark{from{opacity:1}to{opacity:0}}
/* modal */
#modal{position:fixed;inset:0;z-index:50;background:rgba(15,18,30,.6);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
#modal.hidden{display:none}
#modal .sheet{width:100%;max-width:540px;max-height:88vh;overflow:auto;background:radial-gradient(circle at 20% 0%,#fffaf0,#f3e5c4);border-radius:20px 20px 0 0;padding:16px 14px calc(env(safe-area-inset-bottom) + 16px);box-shadow:0 -10px 30px rgba(0,0,0,.35);animation:rise .25s ease-out}
@media(min-width:600px){#modal{align-items:center}#modal .sheet{border-radius:20px}}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#toasts{position:fixed;top:96px;left:0;right:0;z-index:60;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:rgba(36,50,74,.95);color:#fff3d0;padding:8px 14px;border-radius:12px;font-size:13.5px;max-width:92%;box-shadow:0 6px 18px rgba(0,0,0,.3);animation:rise .2s ease-out}
/* golem reveal */
.raidscene{border-radius:14px;overflow:hidden;line-height:0;margin:8px 0}
.raidscene svg{width:100%;display:block}
.golem{transform-box:fill-box;transform-origin:50% 100%;transform:rotate(90deg) translateX(0)}
.golem .eye{opacity:0}
.golem .arm{opacity:0}
.wake .golem{animation:standup .8s cubic-bezier(.3,1.5,.5,1) forwards;animation-delay:calc(var(--i) * .18s)}
.wake .golem .eye{animation:glow .4s forwards;animation-delay:calc(var(--i) * .18s + .6s)}
.wake .golem .arm{animation:glow .3s forwards;animation-delay:calc(var(--i) * .18s + .5s)}
@keyframes standup{0%{transform:rotate(90deg)}60%{transform:rotate(-8deg) translateY(-6px)}100%{transform:rotate(0) translateY(-2px)}}
@keyframes glow{to{opacity:1}}
.raider{transition:transform 1.6s ease-in-out}
.approach .raider{transform:translateX(70px)}
.flee .raider{transform:translateX(-90px);transition-duration:1s}
.shake{animation:shake .4s 2}
@keyframes shake{25%{transform:translate(2px,1px)}50%{transform:translate(-2px,-1px)}75%{transform:translate(1px,-2px)}}
.reveal-line{opacity:0;transition:opacity .5s;line-height:1.4}
.reveal-line.on{opacity:1}
.stars{font-size:26px;letter-spacing:4px}
.lumenglow{filter:drop-shadow(0 0 4px #ffd46b)}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.switch{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px dashed rgba(110,80,40,.25)}
/* Rim City */
#cityLoader{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,#2c3a5a 0,#141a2e 70%)}
#cityLoader.hidden{display:none}
#cityLoader .ldCard{width:min(300px,80%);text-align:center;color:#fff3d0}
#cityLoader .ldTitle{font:600 20px Georgia,serif}
#cityLoader .ldSub{font-size:12px;opacity:.75;margin:4px 0 12px}
#cityLoader .ldBar{height:10px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
#cityLoader .ldBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#c9822f,#ffd46b);transition:width .2s}
#cityLoader .ldPct{font-size:12px;margin-top:6px;opacity:.8}
#city{position:fixed;left:0;right:0;top:96px;bottom:64px;z-index:5;overflow:hidden;background:#3e5854}
#city.hidden{display:none}
#cityCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
#cityCanvas:active{cursor:grabbing}
.cityTop{position:absolute;left:8px;right:56px;top:8px;pointer-events:none;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.cityTitle{font:600 15px Georgia,serif;background:rgba(246,236,212,.92);padding:4px 10px;border-radius:12px;box-shadow:0 3px 10px rgba(0,0,0,.2)}
#cityInfo{font-size:11.5px;background:rgba(36,50,74,.82);color:#fff3d0;padding:3px 9px;border-radius:10px;max-width:100%}
#ticker{max-width:100%;overflow:hidden;background:rgba(255,250,235,.9);border-radius:10px;padding:3px 9px;font-size:12px;box-shadow:0 3px 10px rgba(0,0,0,.15);border-left:4px solid #c9822f}
#ticker span{display:inline-block}
#ticker span.slide{animation:tick .6s ease-out}
@keyframes tick{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.cityBtns{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.cityBtns button{width:42px;height:42px;border-radius:12px;border:1px solid rgba(110,80,40,.3);background:rgba(246,236,212,.94);font-size:19px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.cityBtns button:active{transform:translateY(1px)}
#miniMap{position:absolute;left:8px;bottom:8px;width:112px;height:112px;border-radius:50%;border:3px solid rgba(246,236,212,.95);box-shadow:0 4px 14px rgba(0,0,0,.35);background:#2a3a3a;cursor:pointer;touch-action:none}
#legend{position:absolute;right:58px;top:8px;width:min(300px,calc(100% - 70px));max-height:calc(100% - 16px);overflow:auto;background:rgba(250,243,226,.97);border-radius:14px;padding:10px;box-shadow:0 6px 20px rgba(0,0,0,.3);font-size:13px}
#legend.hidden{display:none}
.legrow{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed rgba(110,80,40,.2);cursor:pointer}
.legrow .sw{width:22px;height:22px;border-radius:6px;flex:0 0 auto;border:1px solid rgba(0,0,0,.2)}
#cityHint{position:absolute;left:128px;right:8px;bottom:12px;text-align:center;font-size:11.5px;color:#fff6dc;text-shadow:0 1px 3px rgba(0,0,0,.6);pointer-events:none}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="titlebar">
      <h1>Hollowdeep<small>prototype</small></h1>
      <span id="speedPill" class="pill"></span>
      <button class="iconbtn" data-act="settings" aria-label="Settings">⚙️</button>
    </div>
    <div id="resbar"></div>
  </header>
  <main id="view"></main>
  <div id="city" class="hidden">
    <canvas id="cityCanvas" aria-label="Rim City map"></canvas>
    <div id="cityLoader" class="hidden"><div class="ldCard"><div class="ldTitle">🎨 Painting Rim City…</div><div class="ldSub">Unpacking homes, trees and the Hollow</div><div class="ldBar"><i></i></div><div class="ldPct">0%</div></div></div>
    <div class="cityTop">
      <div class="cityTitle">🗺️ Rim City <span id="cityCount" class="dim"></span></div>
      <div id="cityInfo"></div>
      <div id="ticker"><span></span></div>
    </div>
    <div class="cityBtns">
      <button data-city="zin" aria-label="Zoom in">＋</button><button data-city="zout" aria-label="Zoom out">－</button>
      <button data-city="home" aria-label="My Lanternhold">🏠</button><button data-city="overview" aria-label="Whole map">🌐</button>
      <button data-city="legend" aria-label="Legend">📖</button><button data-city="journal" aria-label="Journal">📔</button><button data-city="season" aria-label="Seasons">🍂</button>
    </div>
    <canvas id="miniMap" width="240" height="240" aria-label="Minimap"></canvas>
    <div id="legend" class="hidden"></div>
    <div id="cityHint">Drag to explore · pinch or scroll to zoom · tap anything</div>
  </div>
  <nav id="tabs"><div class="wrap">
    <button data-tab="city"><span>🗺️</span>Rim City</button>
    <button data-tab="capital"><span>🏰</span>Capital</button>
    <button data-tab="hollow"><span>🕳️</span>Hollow</button>
    <button data-tab="outposts"><span>🐢</span>Outposts</button>
    <button data-tab="raids"><span>⚔️</span>Raids</button>
    <button data-tab="training"><span>🗡️</span>Training</button>
  </div></nav>
</div>
<div id="modal" class="hidden"><div class="sheet" id="modalBody"></div></div>
<div id="toasts"></div>
<script>
'use strict';
/* =====================================================================
   HOLLOWDEEP — playable prototype
   All tunable numbers live in CONFIG. Times are in GAME hours/minutes;
   TEST MODE multiplies the clock (default 1 game hour = 1 real minute).
   ===================================================================== */
const CONFIG = {
  saveKey: 'hollowdeep.save.v1',
  testMode: { defaultOn: true, speed: 60 },      // ×60: 1 game hour = 1 real minute
  offlineCapHours: 72,                            // max game hours simulated while away
  simStepMinutes: 5,                              // simulation granularity (game minutes)
  awayThresholdRealSec: 45,                       // gap that triggers "While you were away"

  start: { crowns: 250, stone: 150, timber: 150, lumen: 80, moss: 0, iron: 0, coal: 10, steel: 0, amber: 2 },

  resources: {   // weight = how heavy it is to haul up the Tether (The Pull)
    crowns: { icon: '👑', name: 'Crowns',     weight: 0.05 },
    stone:  { icon: '🪨', name: 'Stone',      weight: 0.6 },
    timber: { icon: '🪵', name: 'Timber',     weight: 0.5 },
    lumen:  { icon: '🏮', name: 'Lumen',      weight: 0.1 },
    moss:   { icon: '🌿', name: 'Lanternmoss',weight: 0.5 },
    iron:   { icon: '⛓️', name: 'Iron ore',   weight: 1.0 },
    coal:   { icon: '⚫', name: 'Breathcoal', weight: 1.0 },
    steel:  { icon: '🔩', name: 'Steel',      weight: 0.3 },
    amber:  { icon: '🟠', name: 'Amber',      weight: 0.1 },
  },
  refined: ['crowns', 'lumen', 'steel', 'amber'],   // what "ship refined only" sends

  storage: { base: 600, growth: 1.5, protectBase: 0.30, protectPerLevel: 0.04 },

  hero: { name: 'Wren', basePower: 12, powerPerLevel: 6, xpBase: 60, xpGrowth: 1.35 },

  // Training Grounds tap curve (v2): boost = 100% × (taps in rolling 7 days ÷ weeklyTarget)^exponent
  tap: { weeklyTarget: 300000, dailyCap: 60000, exponent: 0.75, testScale: 0.01, maxTapsPerSec: 12, rollingDays: 7 },

  // Buildings. cost for target level T = base × growth^(T-2) (T=1 for things that start at 0)
  buildings: {
    hall:      { name: 'Lantern Hall',    icon: '🏮', max: 10, base: { crowns: 120, stone: 80 }, growth: 1.6, minutes: 20,
                 desc: 'Heart of the capital. Makes Crowns, Stone and a little Lumen; presses Lanternmoss into Lumen (3:1). Other buildings can be at most Hall level +1.' },
    storehouse:{ name: 'Storehouse',      icon: '📦', max: 10, base: { crowns: 100, stone: 120 }, growth: 1.55, minutes: 15,
                 desc: 'Raises storage caps and protects part of your stock from raiders.' },
    training:  { name: 'Training Grounds',icon: '🗡️', max: 10, base: { crowns: 90, timber: 50 }, growth: 1.55, minutes: 15,
                 desc: 'Hero power +3 per level, and the hero spars for idle XP while home.' },
    lift:      { name: 'Tether Lift',     icon: '🧵', max: 6, base: { crowns: 150, stone: 100, timber: 80 }, growth: 1.7, minutes: 30, steelFrom: 3, steelPer: 12,
                 desc: 'Your Spine. Sets how deep outposts can anchor, how much cargo lifts per hour, and cuts the Pull.' },
    wall:      { name: 'Guardian Wall',   icon: '🗿', max: 10, base: { crowns: 110, stone: 140 }, growth: 1.55, minutes: 20, steelFrom: 4, steelPer: 8,
                 desc: 'Looks like a wall. It is not. Rock golems sleep in its columns and stand up when raiders come.' },
    kennel:    { name: 'Kennel',          icon: '🐾', max: 5, base: { crowns: 100, timber: 60 }, growth: 1.7, minutes: 20, amberFrom: 2, amberPer: 3,
                 desc: 'Pet slots (2nd slot at Lv 3) and +10% pet power per level.' },
    vault:     { name: 'Rim Vault',       icon: '🏦', max: 8, start: 0, base: { crowns: 260, stone: 220 }, growth: 1.6, minutes: 30,
                 desc: 'Deep stone vaults under your Lanternhold. +30% storage cap and +3% raid protection per level. (Public Vaults dot Rim City.)' },
    forge:     { name: 'Rim Forge',       icon: '⚒️', max: 8, start: 0, base: { crowns: 200, stone: 150, timber: 60 }, growth: 1.6, minutes: 25,
                 desc: 'Smelts 2 Iron + 1 Breathcoal → 1 Steel at the Rim. Works, but hauling raw ore up costs a lot of Lumen.' },
  },
  buildTimeGrowth: 1.45,
  hallPerLevel: { crowns: 14, stone: 8, lumen: 2.5, mossPress: 6 },   // per game hour
  trainingPerLevel: { power: 3, sparXp: 4 },
  lift: { maxReach: 4, capacityPerLevel: 30, pullCutPerLevel: 0.08 },
  wall: { baseGolems: 2, golemEvery: 3, maxGolems: 5, golemPower: 10, golemPowerPerLevel: 7 },
  forgePerLevel: 1.5,
  vault: { capPerLevel: 0.30, protectPerLevel: 0.03 },

/* ---------------- derived numbers ---------------- */
function storageCap() { const c = CONFIG.storage; return Math.floor(c.base * Math.pow(c.growth, S.buildings.storehouse - 1) * (1 + CONFIG.vault.capPerLevel * (S.buildings.vault || 0))); }

function canAfford(cost) { return Object.keys(cost).every((k) => (S.res[k] || 0) >= cost[k] - 1e-9); }

function petPower(p) { const d = CONFIG.pets[p.id]; return d.power * (1 + CONFIG.petLevelPower * (p.level - 1)) * (1 + CONFIG.kennelPetBoost * (S.buildings.kennel - 1)); }

function petBonus(key) { return equippedPets().reduce((a, p) => a + (CONFIG.pets[p.id][key] || 0), 0); }

}
function xpToNext(l) { const h = CONFIG.hero; return Math.floor(h.xpBase * Math.pow(h.xpGrowth, (l || S.hero.level) - 1)); }

/* ---------- training boost (rolling 7-day bank) ---------- */
function tapScale() { return S.testMode ? CONFIG.tap.testScale : 1; }
function dayIndex() { return Math.floor(S.gameTime / DAY); }
function tapsToday() { return S.taps.days[dayIndex()] || 0; }
function dailyCap() { return Math.round(CONFIG.tap.dailyCap * tapScale()); }
function weeklyTarget() { return Math.round(CONFIG.tap.weeklyTarget * tapScale()); }

function boostFor(t) { return 100 * Math.pow(Math.min(1, t / weeklyTarget()), CONFIG.tap.exponent); }
function boostPct() { return boostFor(weekTaps()); }

function gainXp(amount, quiet) {
  const gained = amount * (1 + boostPct() / 100);
  S.hero.xp += gained;
  let ups = 0;
  while (S.hero.xp >= xpToNext()) { S.hero.xp -= xpToNext(); S.hero.level++; ups++; }
  if (ups) log('⭐', `${CONFIG.hero.name} reached <b>level ${S.hero.level}</b>!`);
  return gained;
}

/* ---------------- buildings ---------------- */
function buildCost(id) {
  const b = CONFIG.buildings[id], target = S.buildings[id] + 1, mult = Math.pow(b.growth, Math.max(0, target - 2));
  const c = {}; for (const k in b.base) c[k] = Math.round(b.base[k] * mult);
  if (b.steelFrom && target >= b.steelFrom) c.steel = b.steelPer * (target - b.steelFrom + 1);
  if (b.amberFrom && target >= b.amberFrom) c.amber = b.amberPer * (target - b.amberFrom + 1);
  return c;
}
function buildTime(id) { const b = CONFIG.buildings[id], target = S.buildings[id] + 1; return b.minutes * MIN * Math.pow(CONFIG.buildTimeGrowth, Math.max(0, target - 2)); }
function buildBlock(id) {
  const b = CONFIG.buildings[id], lvl = S.buildings[id];
  if (lvl >= b.max) return 'Max level';
  if (id !== 'hall' && lvl + 1 > S.buildings.hall + 1) return `Needs Lantern Hall Lv ${lvl}`;
  if (S.build) return 'Builders busy';

}

  rerender(true);
}

/* ---------------- expeditions ---------------- */
function successChance(L) { return clamp(1 - L.risk + ((attackPower() - L.rec) / L.rec) * 0.3, 0.2, 0.97); }
function startExpedition(layerId) {
  const L = layerById(layerId);

}
function rollLoot(L, mult) {
  const out = {};
  for (const k in L.loot) { let n = rand(L.loot[k][0], L.loot[k][1]) * mult; if (k === 'lumen') n *= 1 + petBonus('lumenFind'); out[k] = Math.round(n); }

}
function lootText(l) { return Object.keys(l).filter((k) => l[k] > 0).map((k) => `${CONFIG.resources[k].icon}${fmt(l[k])}`).join(' '); }
function grantLoot(l) { for (const k in l) addRes(k, l[k]); }

    else { S.pets.push(p); log('🥚', `Found a pet egg! <b>${CONFIG.pets[L.pet].icon} ${CONFIG.pets[L.pet].name}</b> hatched.`); if (!S.slots[0]) S.slots[0] = p.uid; }

}

function rescueCost() { return S.hero.task && S.hero.task.type === 'stranded' ? 8 * S.hero.task.layer : 0; }
function rescueNow() {
  if (!S.hero.task || S.hero.task.type !== 'stranded') return;

/* ---------------- outposts ---------------- */
function stockTotal(o) { return Object.values(o.stock).reduce((a, b) => a + b, 0); }
function opType(o) { return CONFIG.outpostTypes[o.type]; }
function seasoned(o) { return o.state === 'anchored' && S.gameTime - o.anchoredSince >= CONFIG.seasonedDays * DAY; }
function outpostRates(o) {
  if (o.state !== 'anchored') return {};
  const v = veinById(o.vein), m = opType(o).mult * S.veins[o.vein] * (seasoned(o) ? 1 + CONFIG.seasonedBonus : 1) * (o.dark ? CONFIG.darkOutput : 1);
  const r = {}; for (const k in v.prod) r[k] = v.prod[k] * m; return r;
}
function burnRate(o) { return layerById(o.layer).burn; }
function siblings(o) { return S.outposts.filter((x) => x !== o && x.state === 'anchored' && x.layer === o.layer); }
function runModule(o, h) {
  if (!o.module || o.state !== 'anchored') return;
  const m = CONFIG.modules[o.module];
  let batches = m.perHour * h * (o.dark ? CONFIG.darkOutput : 1);
  const pools = [o, ...(o.module === 'smelter' ? siblings(o) : [])];
  for (const k in m.in) { const have = pools.reduce((a, p) => a + (p.stock[k] || 0), 0); batches = Math.min(batches, have / m.in[k]); }
  if (batches <= 1e-6) return;
  for (const k in m.in) {
    let need = batches * m.in[k];
    for (const p of pools) { const take = Math.min(need, p.stock[k] || 0); p.stock[k] = (p.stock[k] || 0) - take; need -= take; if (need <= 1e-9) break; }
  }
  for (const k in m.out) o.stock[k] = (o.stock[k] || 0) + batches * m.out[k];
  o.refined = (o.refined || 0) + batches;
}
function updateOutpost(o, h) {
  const t = S.gameTime, T = opType(o);
  if (o.move && t >= o.move.phaseEnd) {
    if (o.state === 'packing') {
      const layers = Math.abs(o.move.toLayer - o.layer);
      o.state = 'traveling'; o.move.phaseStart = o.move.phaseEnd; o.move.phaseEnd += Math.max(1, layers * T.travelHPerLayer) * HOUR;
      log(T.icon, `${o.name} has packed up and is on the move toward ${layerById(o.move.toLayer).name}.`);
    } else if (o.state === 'traveling') {
      o.state = 'settling'; o.layer = o.move.toLayer; o.vein = o.move.toVein;
      o.move.phaseStart = o.move.phaseEnd; o.move.phaseEnd += T.settleH * HOUR;
    } else if (o.state === 'settling') {
      o.state = 'anchored'; o.anchoredSince = o.move.phaseEnd; o.move = null;
      log('⚓', `${o.name} anchored on the <b>${veinById(o.vein).name}</b> in ${layerById(o.layer).name}.`);
    }
  }
  // Lumen upkeep (keeping the outpost lit)
  const burn = burnRate(o) * h;
  if (S.res.lumen >= burn) { S.res.lumen -= burn; if (o.dark) { o.dark = false; } }
  else { if (!o.dark) log('🌑', `${o.name} went dark: the capital ran out of Lumen. Output drops to 25%.`); o.dark = true; }
  if (o.state === 'anchored') {
    const cap = T.stockCap, r = outpostRates(o);
    let room = cap - stockTotal(o);
    for (const k in r) { const add = Math.min(room, r[k] * h); if (add > 0) { o.stock[k] = (o.stock[k] || 0) + add; room -= add; } }
    o.full = room <= 0.01;
    runModule(o, h);
    S.veins[o.vein] = Math.max(CONFIG.veinMin, S.veins[o.vein] - CONFIG.veinDecayPerDay * h / 24);
  }
}
function pullCost(o, k, qty) {
  const L = layerById(o.layer);
  const cut = (1 - CONFIG.lift.pullCutPerLevel * (S.buildings.lift - 1)) * (1 - petBonus('pullCut'));
  return qty * CONFIG.resources[k].weight * o.layer * L.pull * CONFIG.pull.scale * cut;
}
function shipList(o, mode) {
  const items = {};
  for (const k in o.stock) { if (o.stock[k] < 0.5) continue; if (mode === 'refined' && !CONFIG.refined.includes(k)) continue; items[k] = o.stock[k]; }
  return items;
}
function shipPreview(o, mode) {
  const items = shipList(o, mode || 'all'); let cost = 0, weight = 0;
  for (const k in items) { cost += pullCost(o, k, items[k]); weight += items[k] * CONFIG.resources[k].weight; }
  return { items, cost, weight };
}
// Ship goods up the Tether. Capacity (weight) per cycle is shared; Lumen pays the Pull.
function shipOutpost(o, mode, capLeft, manual) {
  if (mode === 'off' || o.state !== 'anchored') return { weight: 0, cost: 0, got: {} };
  const items = shipList(o, mode); const got = {}; let w = 0, c = 0;
  for (const k of Object.keys(items).sort((a, b) => CONFIG.resources[a].weight - CONFIG.resources[b].weight)) {
    let qty = items[k];
    const wt = CONFIG.resources[k].weight;
    qty = Math.min(qty, wt > 0 ? (capLeft - w) / wt : qty);
    const unit = pullCost(o, k, 1);
    if (unit > 0) qty = Math.min(qty, (S.res.lumen) / unit);

function rivalLoot(i) {

/* ---- Wren's journal (written on return from time away) ---- */
function writeJournal(sum) {

  if (exps.length === 1) P.push(`I went down the Tether and came back with ${strip(exps[0].msg).split(': ')[1] || 'a full pack'}.`);

  if (by('🕯️').length) P.push('My lantern guttered out on a ledge once. I sat in the dark counting heartbeats until the rescue line found me.');
  const def = by('🗿');
  def.forEach((e) => P.push(/routed/.test(e.msg) ? 'Raiders came for the wall. The golems stood up (I will never get used to that sound) and sent them running.' : 'Raiders broke through while I was away. The golems did what they could. We need a deeper Vault.'));

  if (by('🦴').length) P.push('I fought a Rim Mole in front of half the city. Its skull hangs over our door now.');
  if (by('🥚').length) P.push('Found an egg in the dark and carried it up under my coat. It hatched by the fire.');
  if (by('🌑').length) P.push('Our outposts went dark for a while. Not enough Lumen. I hate leaving them blind.');
  const anch = by('⚓'); if (anch.length) P.push('Our outpost found new footing below. The crew sent a cheer up the line.');
  const blds = ev.filter((e) => /upgraded to Lv/.test(e.msg)); if (blds.length) P.push(`The builders finished ${blds.map((e) => strip(e.msg).split(' upgraded')[0]).join(', ')}.`);
  if (sum.levels) P.push(`I feel stronger. Level ${S.hero.level} now.`);
  if (!P.length) P.push(['Quiet days. I sharpened my blade, watched the sky-fish drift, and let Old Maddox tell me the same story twice.', 'Nothing much happened. I sat on the Promenade and watched Pell light the lamps.', 'A slow stretch. I fed the pets and listened to the Hollow breathe.'][Math.floor(Math.random() * 3)]);
  try { const si = seasonInfo(); P.push(`${SEASONS[si.idx].icon} ${SEASONS[si.idx].name} on the Rim.`); } catch (e) { /* map not loaded */ }

}
/* ---- Rim City markets ---- */
function marketBuy(k, lot, mult) {

}

function scheduleNextRaid() { const [a, b] = CONFIG.raids.intervalHours; S.nextRaidAt = S.gameTime + rand(a, b) * HOUR; }
const RAIDER_NAMES = ['the Ashgull Lodge', 'Brakka\'s Cable-Cutters', 'the Hollow Jackals', 'a Kite crew from the east rim', 'the Lantern Thieves'];
function aiRaid() {
  scheduleNextRaid();
  if (S.gameTime < S.shieldUntil) return;
  const R = CONFIG.raids, who = pick(RAIDER_NAMES), first = S.raidCount === 0;
  S.raidCount++;
  const growth = 1 + R.growthPerDay * (S.gameTime / DAY);
  const bait = S.outposts.filter((o) => o.state !== 'anchored' || stockTotal(o) > 0.6 * opType(o).stockCap);
  if (!first && bait.length && Math.random() < R.outpostBaitChance) {
    const o = pick(bait), T = opType(o);
    const def = (T.defense + o.layer * 6) * (o.state === 'anchored' ? 1 : 0.5);
    const atk = def * rand(0.7, 1.5) * growth, stars = starsFor(atk / def);
    const lost = {};
    if (stars > 0) for (const k in o.stock) { const n = o.stock[k] * R.outpostLootPct * stars / 3; if (n >= 1) { lost[k] = Math.floor(n); o.stock[k] -= lost[k]; } }
    const why = o.state !== 'anchored' ? 'caught it in transit' : 'smelled a full stockhold';
    log('🏴', `${who} ${why} and hit <b>${o.name}</b>. ${stars ? 'They hauled off ' + (lootText(lost) || 'a few crates') + '.' : 'The crew drove them off!'}`);
    S.lastRaid = { kind: 'outpost', who, name: o.name, stars, lost, t: S.gameTime };
    return;
  }
  const def = defensePower();
  const atk = first ? def * 0.7 : def * rand(0.7, 1.35) * growth;
  const stars = starsFor(atk / def), lost = {}, gained = {};
  if (stars > 0) {
    const share = R.lootPct * stars / 3, prot = protectedShare();
    for (const k of ['crowns', 'stone', 'lumen', 'steel', 'timber']) { const n = Math.floor(S.res[k] * (1 - prot) * share); if (n > 0) { lost[k] = n; S.res[k] -= n; } }
  } else {
    gained.crowns = Math.round(40 + atk * 1.5); gained.stone = Math.round(atk); grantLoot(gained); S.stats.defended++;
  }
  S.shieldUntil = S.gameTime + R.shieldHours * HOUR;
  const report = { kind: 'defense', who, stars, lost, gained, atk: Math.round(atk), def: Math.round(def), golems: golemCount(), golemPower: golemPower(), heroHome: heroHome(), t: S.gameTime, first };
  S.lastRaid = report;
  log('🗿', `${who} raided your capital. The wall stood up: ${golemCount()} rock golems woke. ${stars ? `They broke through (${'★'.repeat(stars)}) and took ${lootText(lost) || 'little'}.` : `Raiders routed! Spoils: ${lootText(gained)}.`}`);

/* ---------------- simulation ---------------- */
function step(dt) {
  const h = dt / HOUR; S.gameTime += dt;
  const lv = S.buildings.hall, H = CONFIG.hallPerLevel;
  addRes('crowns', H.crowns * lv * h); addRes('stone', H.stone * lv * h); addRes('lumen', H.lumen * lv * h);
  const press = Math.min(S.res.moss, H.mossPress * lv * h); if (press > 0) { S.res.moss -= press; addRes('lumen', press / 3); }
  if (S.buildings.forge > 0) {
    const n = Math.min(CONFIG.forgePerLevel * S.buildings.forge * h, S.res.iron / 2, S.res.coal);
    if (n > 0) { S.res.iron -= 2 * n; S.res.coal -= n; addRes('steel', n); }
  }
  if (heroHome()) gainXp(CONFIG.trainingPerLevel.sparXp * S.buildings.training * h);
  if (S.build && S.gameTime >= S.build.end) {
    S.buildings[S.build.id] = S.build.to;
    log(CONFIG.buildings[S.build.id].icon, `<b>${CONFIG.buildings[S.build.id].name}</b> upgraded to Lv ${S.build.to}.`);
    S.build = null;
  }
  if (S.hero.task && S.gameTime >= S.hero.task.end) finishHeroTask();
  for (const o of S.outposts) updateOutpost(o, h);
  const used = new Set(S.outposts.map((o) => o.vein));
  for (const k in S.veins) if (!used.has(k)) S.veins[k] = Math.min(1, S.veins[k] + CONFIG.veinRegenPerDay * h / 24);
  while (S.gameTime >= S.nextShipAt) { shipAll(); S.nextShipAt += CONFIG.pull.shipEveryHours * HOUR; }
  if (S.gameTime >= S.nextRaidAt) aiRaid();
  pruneTaps();
}
function simulate(dtGame) {
  const stepMs = CONFIG.simStepMinutes * MIN;
  while (dtGame > 0) { const d = Math.min(stepMs, dtGame); step(d); dtGame -= d; }
}
// Runs a chunk of time "while away" and returns a summary
function simulateAway(dtGame) {
  const before = Object.assign({}, S.res), lvl = S.hero.level;
  const capped = Math.min(dtGame, CONFIG.offlineCapHours * HOUR);
  ui.collecting = [];
  simulate(capped);
  const events = ui.collecting; ui.collecting = null;
  const delta = {}; for (const k of RES) { const d = (S.res[k] || 0) - (before[k] || 0); if (Math.abs(d) >= 1) delta[k] = d; }
  return { gameMs: capped, cappedFrom: dtGame, delta, events, levels: S.hero.level - lvl };
}

function buildingEffect(id, lvl) {
  const H = CONFIG.hallPerLevel;
  switch (id) {
    case 'hall': return `${H.crowns * lvl}👑 ${H.stone * lvl}🪨 ${fmt1(H.lumen * lvl)}🏮 /h`;
    case 'storehouse': { const c = CONFIG.storage; return `cap ${fmt(c.base * Math.pow(c.growth, lvl - 1))} · protects ${Math.round(clamp(c.protectBase + c.protectPerLevel * (lvl - 1), 0, .8) * 100)}%`; }
    case 'training': return `+${CONFIG.trainingPerLevel.power * (lvl - 1)} power · spar ${CONFIG.trainingPerLevel.sparXp * lvl} XP/h`;
    case 'lift': return `reach layer ${Math.min(CONFIG.lift.maxReach, lvl + 1)} · ${CONFIG.lift.capacityPerLevel * lvl} wt/h · Pull −${Math.round(CONFIG.lift.pullCutPerLevel * (lvl - 1) * 100)}%`;
    case 'wall': { const w = CONFIG.wall; return `${Math.min(w.maxGolems, w.baseGolems + Math.floor((lvl - 1) / w.golemEvery))} golems × ${w.golemPower + w.golemPowerPerLevel * (lvl - 1)} power`; }
    case 'kennel': return `${lvl >= 3 ? 2 : 1} pet slot${lvl >= 3 ? 's' : ''} · pets +${Math.round(CONFIG.kennelPetBoost * (lvl - 1) * 100)}%`;
    case 'vault': return lvl ? `storage +${Math.round(CONFIG.vault.capPerLevel * lvl * 100)}% · protection +${Math.round(CONFIG.vault.protectPerLevel * lvl * 100)}%` : 'not built';
    case 'forge': return lvl ? `${fmt1(CONFIG.forgePerLevel * lvl)} 🔩/h from raw ore` : 'not built';
  }
  return '';
}

  const L = seasonLen(), t = gTime(); return { idx: Math.floor(t / L) % 4, prog: (t % L) / L, nextIn: L - (t % L) };
}

    }

  }
