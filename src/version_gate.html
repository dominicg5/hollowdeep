<script>window.HD_BUILD='__B__';
/* Version check (t421u): runs BEFORE the game boots. The page can come from a stale cache (GitHub Pages sends max-age=600); the old check fetched the whole
   2.3 MB index.html in the background and called location.replace() once the game had already booted, so phones booted twice back to back and iOS Safari
   killed the tab on the second boot. Now: fetch the tiny version.json first, hold the game's init (HD_GATE) until it answers or 2.5 s pass, and only
   then either boot or switch to the new build - at most once per build per tab (sessionStorage), never in a loop. Mid-session updates don't reload on their
   own: a small "Update ready" button appears and reloads only when tapped (after saving and freeing the WebGL contexts). */
(function () {
  var base = location.href.split('#')[0].split('?')[0].replace(/index\.html$/, '');
  function latest() { return fetch(base + 'version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) { return j && /^[0-9a-f]{8}$/.test(j.b) ? j.b : null; }).catch(function () { return null; }); }
  function tried(b) { try { return sessionStorage.getItem('hdReload') === b; } catch (e) { return true; } }
  function mark(b) { try { sessionStorage.setItem('hdReload', b); } catch (e) {} }
  window.hdReloadTo = function (url) { try { if (typeof save === 'function') save(); } catch (e) {} /* free the GPU memory now rather than when iOS gets round to it */
    try { var cs = document.querySelectorAll('canvas'); for (var i = 0; i < cs.length; i++) { var c = cs[i], g = null; try { g = c.getContext('webgl2') || c.getContext('webgl'); } catch (e) {} var x = g && g.getExtension('WEBGL_lose_context'); if (x) x.loseContext(); } } catch (e) {}
    setTimeout(function () { location.replace(url || location.href); }, 30); };
  var url = function (b) { return base + '?v=' + b + location.hash; };
  window.HD_GATE = new Promise(function (res) { var done = false, fin = function (go) { if (!done) { done = true; res(go); } }; setTimeout(function () { fin(true); }, 2500);
    latest().then(function (b) { if (b && b !== window.HD_BUILD && !tried(b)) { mark(b); fin(false); location.replace(url(b)); } else fin(true); }); });
  function later() { latest().then(function (b) { if (!b || b === window.HD_BUILD || document.getElementById('hdUpd')) return; var u = document.createElement('button'); u.id = 'hdUpd'; u.textContent = 'Update ready - tap to reload';
    u.style.cssText = 'position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 6px);transform:translateX(-50%);z-index:99999;padding:7px 14px;border:0;border-radius:16px;font:600 13px system-ui,sans-serif;background:#2f6f6a;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35)';
    u.onclick = function () { mark(b); window.hdReloadTo(url(b)); }; document.body.appendChild(u); }); }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) later(); }); window.addEventListener('pageshow', function (e) { if (e.persisted) later(); });
})();</script>
